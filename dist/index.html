<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#141519">
 <meta name="description" content="属于你的前端设计工作台。81 个原创组件、24 套整页模板与 80+ 种动效，画布上的任何元素都能拖动、旋转、改样式，导出干净的原生代码。">
 <title>Design Atlas · 前端设计工作台</title>
 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%233d6655'/%3E%3Ctext x='24' y='35' text-anchor='middle' font-size='36' fill='%23f2edce'%3E✳%3C/text%3E%3C/svg%3E">
 <script>try{const m=localStorage.getItem("design-atlas.ui-theme");document.documentElement.dataset.ui=m==="dark"||m!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch{}</script>
 <link rel="stylesheet" href="tokens.css">
 <link rel="stylesheet" href="app.css">
 <link rel="stylesheet" href="cases.css">
 <link rel="stylesheet" href="studio.css">
 <link rel="stylesheet" href="v3.css">
 <link rel="stylesheet" href="atlas.css">
</head>
<body>
 <a class="skip-link" href="#main">跳到主要内容</a>
 <aside class="sidebar" id="sidebar" aria-label="主要导航">
  <a class="logo" href="#library" aria-label="Design Atlas 首页"><span class="logo-mark">✳</span><span>design<span class="logo-bottom">atlas<span class="logo-dot">®</span></span></span></a>
  <div class="workspace-label"><i></i> PERSONAL WORKSPACE <button id="close-sidebar" class="icon-btn mobile-only" aria-label="关闭导航">×</button></div>
  <nav class="primary-nav">
   <button data-view="cases" class="nav-item" data-tip="公开网站案例"><span data-icon="external"></span>公开网站案例<span class="nav-count" id="nav-cases">—</span></button>
   <button data-view="library" class="nav-item active" data-tip="设计资源库"><span data-icon="grid"></span>设计资源库<span class="nav-count" id="nav-total">30</span></button>
   <button data-view="builder" class="nav-item" data-tip="页面拼装台"><span data-icon="layers"></span>页面拼装台<span class="new-label">LAB</span></button>
   <button data-view="projects" class="nav-item" data-tip="我的项目"><span data-icon="file"></span>我的项目<span class="nav-count" id="nav-projects">0</span></button>
   <button data-view="themes" class="nav-item" data-tip="主题实验室"><span data-icon="palette"></span>主题实验室</button>
   <button data-view="fx" class="nav-item" data-tip="特效实验室"><span data-icon="spark"></span>特效实验室<span class="new-label hot">NEW</span></button>
   <button data-view="favorites" class="nav-item" data-tip="我的收藏"><span data-icon="heart"></span>我的收藏<span class="nav-count" id="favorite-count">0</span></button>
  </nav>
  <div class="nav-heading">你的设计工具箱</div>
  <nav class="secondary-nav">
   <button data-section="references" class="nav-item" data-tip="本地设计参考"><span data-icon="book"></span>本地设计参考<span class="nav-count" id="nav-references">—</span></button>
   <button data-section="opensource" class="nav-item" data-tip="开源资源索引"><span data-icon="code"></span>开源资源索引<span class="nav-count" id="nav-opensource">—</span></button>
   <button data-section="skills" class="nav-item" data-tip="本地设计 Skills"><span data-icon="spark"></span>本地设计 Skills<span class="nav-count" id="nav-skills">—</span></button>
  </nav>
  <div class="sidebar-bottom">
   <div class="sidebar-note"><span>FROM IDEAS<br>TO INTERFACES.</span><b aria-hidden="true">↗</b><p>一点灵感，一点尝试。<br>做出属于你的好界面。</p><button data-view="builder">开始我的设计 <span>↗</span></button></div>
   <button class="about-link" id="about-button"><span data-icon="info"></span>关于这个工作台<span>↗</span></button>
   <div class="local-status"><i></i> 本地自动保存 <span>v4.2</span></div>
  </div>
 </aside>
 <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
 <div class="app-shell">
  <header class="topbar">
   <div class="breadcrumbs"><button id="mobile-menu" class="icon-btn mobile-only" aria-label="打开导航"><span data-icon="menu"></span></button><span>我的工作空间</span><i>/</i><strong id="breadcrumb-current">设计资源库</strong></div>
   <div class="top-actions"><button class="global-search-trigger" data-studio-action="search" aria-label="搜索全部设计与操作"><span>⌕ 搜索全部</span><kbd>Ctrl K</kbd></button><span class="save-status" id="save-status"><i></i>已保存在此浏览器</span><button class="top-icon" id="ui-theme" aria-label="切换深色模式" title="切换深色 / 浅色"><span data-icon="moon"></span></button><button class="top-icon" id="keyboard-help" aria-label="快捷键与使用说明"><span data-icon="help"></span></button><span class="user-avatar" aria-label="本地个人工作空间">A</span></div>
  </header>
  <main id="main" tabindex="-1"><div class="loading-state"><span class="loading-mark">✳</span><p>正在打开你的设计工作台…</p></div></main>
  <footer class="app-footer"><span>CRAFTED FOR YOUR NEXT IDEA.</span><span>原创演示 MIT · 第三方资源独立授权 <i>✳</i></span></footer>
 </div>
 <dialog id="detail-dialog" class="detail-dialog"><div id="detail-content"></div></dialog>
 <dialog id="code-dialog" class="code-dialog"><div id="code-content"></div></dialog>
 <dialog id="info-dialog" class="info-dialog"><div id="info-content"></div></dialog>
 <div class="toast-stack" id="toast-stack" role="status" aria-live="polite" aria-atomic="true"></div>
 <input type="file" id="project-file" accept=".json,application/json" hidden>
 <noscript>这个设计工作台需要启用 JavaScript。源码与使用方式请查看随附 README。</noscript>
 <script type="module" src="app.js"></script>
</body>
</html>
