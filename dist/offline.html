const rows=p=>String(p.items||'').split('\n').filter(Boolean).slice(0,20).map(s=>s.split('|').map(x=>escapeHTML(x.trim())));
const head=p=>`<header class="section-heading"><span class="eyebrow">${escapeHTML(p.eyebrow)}</span><h2>${escapeHTML(p.title).replaceAll('\n','<br>')}</h2><p>${escapeHTML(p.subtitle)}</p></header>`;
const navTabs=(r,id)=>`<div class="pattern-tabs" role="tablist" aria-label="切换内容">${r.map((x,i)=>`<button type="button" role="tab" id="${id}-tab-${i}" aria-controls="${id}-panel-${i}" aria-selected="${i===0}" tabindex="${i===0?0:-1}" data-pattern-tab="${i}">${x[0]}</button>`).join('')}</div>`;
const renderers={
 'intro-index':(p,b)=>{const id='intro-'+escapeHTML(b.uid),r=rows(p);return `<div class="intro-layout"><div class="intro-sticky">${head(p)}<nav aria-label="个人章节">${r.map((x,i)=>`<a href="#${id}-${i}" data-pattern-jump>${String(i+1).padStart(2,'0')} <span>${x[0]}</span> ↗</a>`).join('')}</nav></div><div class="intro-chapters">${r.map((x,i)=>`<article id="${id}-${i}"><span class="eyebrow">0${i+1} / ${x[0]}</span><h3>${x[0]}</h3><p>${x[1]||''}</p></article>`).join('')}</div></div>`;},
 'project-index':p=>`${head(p)}<div class="project-index">${rows(p).map(x=>`<details><summary><span>${x[0]}</span><h3>${x[2]||''}</h3><small>${x[1]||''}</small><b>↗</b></summary><p>${x[3]||''}</p></details>`).join('')}</div>`,
 'article-list':p=>`${head(p)}<label class="pattern-search"><span>⌕</span><input type="search" data-article-search placeholder="${escapeHTML(p.button)}" aria-label="搜索文章"></label><div class="article-list">${rows(p).map(x=>`<details data-article><summary><time>${x[0]}</time><h3>${x[2]||''}</h3><span class="tag">${x[1]||''}</span><small>${x[3]||''} ↗</small></summary><p>这是可展开的文章摘要示例。请在自己的页面里替换为文章简介和真实链接。</p></details>`).join('')}<p data-article-empty hidden>没有匹配的文章，换个关键词试试。</p></div>`,
 'resume':p=>`${head(p)}<div class="resume-list">${rows(p).map(x=>`<article><time>${x[0]}</time><div><h3>${x[1]||''}</h3><p>${x[2]||''}</p></div></article>`).join('')}</div>`,
 'now-board':p=>`${head(p)}<div class="now-grid">${rows(p).map(x=>`<article class="panel"><span class="glyph">${x[2]||'✳'}</span><span class="tag">${x[0]}</span><h3>${x[1]||''}</h3><small>一个此刻的记录</small></article>`).join('')}</div>`,
 'case-story':(p,b)=>{const r=rows(p),id='story-'+escapeHTML(b.uid);return `${head(p)}<div class="pattern-switcher story-switcher">${navTabs(r,id)}${r.map((x,i)=>`<article class="story-panel" role="tabpanel" id="${id}-panel-${i}" aria-labelledby="${id}-tab-${i}" ${i?'hidden':''}><span class="story-number">0${i+1}</span><div><h3>${x[1]||''}</h3><p>${x[2]||''}</p></div></article>`).join('')}</div>`;},
 'feature-demo':(p,b)=>{const r=rows(p),id='demo-'+escapeHTML(b.uid);return `${head(p)}<div class="pattern-switcher feature-switcher">${navTabs(r,id)}${r.map((x,i)=>`<div class="feature-panel" role="tabpanel" id="${id}-panel-${i}" aria-labelledby="${id}-tab-${i}" ${i?'hidden':''}><div><span class="eyebrow">0${i+1} / ${x[0]}</span><h3>${x[1]||''}</h3><p>${x[2]||''}</p><button class="btn" data-demo>${escapeHTML(p.button)} ↗</button></div><div class="feature-mock"><div class="mock-dots">● ● ●</div><span class="tag">YOUR WORKSPACE / ${x[0]}</span>${[0,1,2].map((_,j)=>`<label class="mock-task"><input type="checkbox" ${j<i?'checked':''}><span>${['记录新的想法','调整优先级','为下一步做准备'][j]}</span></label>`).join('')}<small>可勾选 · 本地交互示例</small></div></div>`).join('')}</div>`;},
 'app-window':p=>`${head(p)}<button class="btn" data-demo>${escapeHTML(p.button)} ↗</button><div class="app-window-demo"><aside><b>◈ SPACE</b>${rows(p).map((x,i)=>`<button type="button" data-app-view="${x[1]||x[0]}" aria-pressed="${i===0}">${x[0]}</button>`).join('')}</aside><div><span class="eyebrow">YOUR QUIET WORKSPACE</span><h3 data-app-heading>${rows(p)[0]?.[1]||'完成一个小目标'}</h3><div class="app-task-input"><input aria-label="新任务" placeholder="写下今天想完成的事" maxlength="100"><button class="btn" data-app-add>添加</button></div><ul data-app-tasks><li><label><input type="checkbox"> 留一点时间给好想法</label></li></ul><small>本地演示 · 刷新后重置</small></div></div>`,
 'comparison':p=>{const cols=String(p.button||'').split(',').slice(0,4).map(escapeHTML);return `${head(p)}<div class="comparison-scroll" tabindex="0" role="region" aria-label="方案对比表，可横向滚动"><table class="comparison-table"><caption class="sr-only">方案功能对比，演示数据</caption><thead><tr><th scope="col">功能</th>${cols.map(c=>`<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>${rows(p).map(x=>`<tr><th scope="row">${x[0]}</th>${cols.map((_,i)=>`<td>${x[i+1]||'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;},
 'release-log':p=>{const r=rows(p),tags=[...new Set(r.map(x=>x[1]))];return `${head(p)}<div class="release-filters" role="group" aria-label="更新类型">${['全部',...tags].map((x,i)=>`<button data-release-filter="${x}" aria-pressed="${i===0}">${x}</button>`).join('')}</div><div class="release-list">${r.map(x=>`<article data-release-type="${x[1]||''}"><time>${x[0]}</time><div><span class="tag">${x[1]||''}</span><h3>${x[2]||''}</h3><p>${x[3]||''}</p></div></article>`).join('')}</div>`;},
 'testimonial-wall':p=>`${head(p)}<div class="testimonial-wall">${rows(p).map((x,i)=>`<figure class="panel"><span class="eyebrow">0${i+1} / FEEDBACK</span><blockquote>“${x[2]||''}”</blockquote><figcaption><strong>${x[0]}</strong><span>${x[1]||''} · 演示角色</span></figcaption></figure>`).join('')}</div>`,
 'split-manifesto':p=>`<div class="manifesto-layout"><div>${head(p)}<button class="btn" data-demo>${escapeHTML(p.button)} ↗</button></div><div class="manifesto-principles"><span class="manifesto-symbol" aria-hidden="true">✳</span>${rows(p).map(x=>`<p><span>${x[0]}</span>${x[1]||''}</p>`).join('')}</div></div>`
};

function normalizeTheme(t={}){if(!t||typeof t!=='object'||Array.isArray(t))t={};const base=THEMES.find(x=>x.id===t.id)||THEMES[0];const hex=v=>typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v);return {...base,...Object.fromEntries(['accent','bg','surface','ink','muted'].filter(k=>hex(t[k])).map(k=>[k,t[k]])),font:['sans','serif','mono'].includes(t.font)?t.font:base.font,radius:Math.max(0,Math.min(40,Number(t.radius)||0)),space:Math.max(24,Math.min(120,Number(t.space)||64)),style:['soft','flat','brutal'].includes(t.style)?t.style:base.style};}
function validateProject(data){if(!data||data.version!==1||!Array.isArray(data.blocks)||data.blocks.length>100)throw Error('项目格式不正确：需要 version:1，且模块不超过 100 个。');const blocks=data.blocks.map(b=>{if(!b||typeof b!=='object')throw Error('模块格式不正确。');const def=BLOCKS.find(x=>x.id===b.type);if(!def||!b.props||typeof b.props!=='object')throw Error('包含未知模块或缺少模块属性。');const props={};for(const key of Object.keys(def.props)){props[key]=typeof b.props[key]==='string'?b.props[key].slice(0,4000):def.props[key];}return {uid:uid(),type:def.id,props,hidden:!!b.hidden};});if(data.customCSS!=null&&typeof data.customCSS!=='string')throw Error('自定义 CSS 应为文本。');return {version:1,name:typeof data.name==='string'?data.name.slice(0,100):'我的作品',theme:normalizeTheme(data.theme),blocks,customCSS:(data.customCSS||'').slice(0,50000)};}
function cssFor(project){const t=normalizeTheme(project.theme);const fonts={sans:'Inter, "Segoe UI", "Microsoft YaHei", sans-serif',serif:'Georgia, "Noto Serif SC", "Songti SC", "SimSun", serif',mono:'"Cascadia Code", "SFMono-Regular", Consolas, "Microsoft YaHei", monospace'};return `:root{--accent:${t.accent};--bg:${t.bg};--surface:${t.surface};--ink:${t.ink};--muted:${t.muted};--radius:${t.radius}px;--space:${t.space}px;--font:${fonts[t.font]};--line:color-mix(in srgb,var(--ink) 14%,transparent);--tint:color-mix(in srgb,var(--accent) 9%,var(--surface));--button-ink:${contrastInk(t.accent)};--shadow:${t.style==='brutal'?'5px 5px 0 var(--ink)':t.style==='flat'?'none':'0 12px 36px color-mix(in srgb,var(--ink) 5%,transparent)'};}
${BASE_CSS}
${EXTRA_CSS}

 function edit(id){const c=id?find(id):null;const field=(key,label,value='',extra='')=>`<label>${label}<input name="${key}" value="${esc(value)}" ${extra}></label>`;show(top('GROW YOUR LIBRARY',c?'编辑我的案例':'保存一个值得借鉴的网站','只保存你的整理与来源链接；不抓取或上传网站资产。')+`<form id="case-edit-form" class="case-edit-form" data-edit-id="${esc(c?.id||'')}"><div class="case-form-grid">${field('name','网站名称',c?.name,'required maxlength="100"')}${field('url','公开网站链接',c?.url,'required type="url" placeholder="https://…" maxlength="2048"')}<label>网站类型<select name="type">${['个人网站','作品集','产品页','工作室'].map(t=>`<option ${c?.type===t?'selected':''}>${t}</option>`).join('')}</select></label>${field('category','内容分类',c?.category||'我的参考','required maxlength="60"')}</div><label>一句话说明<textarea name="summary" required maxlength="1200" placeholder="这个页面如何组织内容，什么地方值得借鉴？">${esc(c?.summary||'')}</textarea></label><div class="case-form-grid">${field('styles','风格（逗号分隔）',c?.styles.join(', ')||'极简','maxlength="500"')}${field('patterns','设计模式（逗号分隔）',c?.patterns.join(', ')||'目录导航','maxlength="500"')}${field('tags','标签（逗号分隔）',c?.tags.join(', ')||'个人收藏','maxlength="500"')}<label>原创布局配方${recipeSelect(c?.recipe||'minimal-profile','edit-case-recipe')}</label><label>建议主题${themeSelect(c?.theme||'atelier','edit-case-theme')}</label></div><label>借鉴要点（每行一条）<textarea name="takeaways" maxlength="2400">${esc(c?.takeaways.join('\n')||'')}</textarea></label><label>适用边界<textarea name="caution" maxlength="1000">${esc(c?.caution||'')}</textarea></label><div class="case-form-footer"><span>保存后可随时编辑，或导出 JSON 扩展包。</span><button class="primary-button" type="submit">保存案例 ✓</button></div></form>`);}

 if(id==='bento'||id==='features')return f(`<div class="art-mini-panels"><div>FOR YOUR FOCUS<b>✳</b></div><div>Less, but better.<div class="bars"><i></i><i></i><i></i></div></div><div>Make it yours. ↗</div></div>`);
 if(id==='pricing')return f(`<div class="art-eyebrow">FIND YOUR LITTLE SPACE</div><div class="art-price">${[0,29,79].map(x=>`<div>STUDIO<b>¥${x}</b><i></i><i></i><span class="art-button"></span></div>`).join('')}</div>`);
 if(['contact','login','newsletter','command'].includes(id))return f(`<div class="art-form"><div class="art-eyebrow">${id==='command'?'AT YOUR FINGERTIPS':'HELLO, NEW POSSIBILITY'}</div><strong>${id==='login'?'Welcome back.':id==='newsletter'?'Stay curious.':id==='command'?'Find your next idea.':'Let’s make it happen.'}</strong><div class="art-input"></div><div class="art-input"></div><span class="art-button"></span></div>`);
 if(id==='dashboard'||id==='stats')return f(`<div class="art-eyebrow">YOUR CREATIVE OVERVIEW</div><div class="art-metrics">${['28,460','1,284','92.4%'].map(x=>`<span>THIS MONTH<b>${x}</b></span>`).join('')}</div><div class="art-chart"><svg viewBox="0 0 200 65"><path d="M0 55Q20 65 35 40T65 38T100 25T140 20T180 10L200 3" fill="none" stroke="#839b68" stroke-width="2"/><path d="M0 55Q20 65 35 40T65 38T100 25T140 20T180 10L200 3V65H0Z" fill="#839b681a"/></svg></div>`);
 if(id==='quote'||id==='testimonials')return f(`<div class="art-quote"><span>“</span><p>Good design makes<br>room for good things.</p><small>A THOUGHT WORTH KEEPING</small></div>`);

function renderCard(item,index){if(item.kind==='site')return caseUI.card(item);const liked=favorites.has(keyOf(item)),kind=item.kind||'block',isPlayable=['block','template'].includes(kind),mood=item.mood||{design:'sage',build:'blue',verify:'sand'}[item.role]||(kind==='reference'?'sand':'neutral');return `<article class="design-card" data-item-key="${esc(keyOf(item))}"><div class="card-art ${esc(mood)}" role="button" tabindex="0" data-open="${esc(keyOf(item))}" aria-label="查看${esc(item.name)}"><span class="art-caption">${String(index+1+(view.page-1)*18).padStart(2,'0')} / ${isPlayable?'ORIGINAL EXPLORATION':kind==='reference'?'DESIGN REFERENCE':kind==='skill'?'LOCAL SKILL':'RESOURCE INDEX'}</span><span class="card-badge">${kind==='block'?'可实时编辑':kind==='template'?'整页可拼装':kind==='reference'?'DESIGN.md':kind==='skill'?'本地索引':item.projectType==='source-available'?'特殊授权':'开源资源'}</span>${thumb(item)}${isPlayable?`<div class="card-overlay"><button data-preview="${esc(item.id)}" data-kind="${kind}">${icon('eye').replace('<svg ','<svg style="display:none" ')}试试预览</button><button data-add="${esc(item.id)}" data-kind="${kind}">${kind==='template'?'使用模板':'加入拼装'} ↗</button></div>`:''}</div><div class="card-body"><div class="card-title-row"><h3><button data-open="${esc(keyOf(item))}">${esc(item.name)}</button></h3><button class="favorite-btn ${liked?'liked':''}" data-favorite="${esc(keyOf(item))}" aria-label="${liked?'取消收藏':'收藏'}${esc(item.name)}" aria-pressed="${liked}">${icon('heart')}</button></div><p class="card-desc">${esc(item.descriptionZh||item.description||'一份值得收藏的设计参考。')}</p><div class="card-footer">${(item.tags||[item.category]).filter(Boolean).slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span class="card-source"><i></i>${isPlayable?'原创 · MIT':kind==='reference'?'本地参考':kind==='skill'?roleName(item.role):esc(licenseOf(item))}</span></div></div></article>`;}

function toggleFavorite(key){favorites.has(key)?favorites.delete(key):favorites.add(key);try{localStorage.setItem(FAVS,JSON.stringify([...favorites]))}catch{toast('收藏无法保存到浏览器。',true)}navigation();if(view.name==='favorites')renderLibrary();else{$$(`[data-favorite]`).filter(e=>e.dataset.favorite===key).forEach(e=>{const liked=favorites.has(key);e.classList.toggle('liked',liked);e.setAttribute('aria-pressed',liked);e.setAttribute('aria-label',(liked?'取消收藏':'收藏')+(allItems().find(i=>keyOf(i)===key)?.name||''))})}}
function openDialog(d){if(!d.open)d.showModal();document.body.style.overflow='hidden';}
function closeDialog(d){d.close();if(!$$('dialog[open]').length)document.body.style.overflow='';}
for(const d of [details,codeDialog,infoDialog]){d.addEventListener('close',()=>{if(!$$('dialog[open]').length)document.body.style.overflow=''});d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog(d)}})}
function deviceControls(scope,device='desktop'){return `<div class="device-buttons" role="group" aria-label="预览宽度">${['desktop','tablet','mobile'].map(d=>`<button data-device="${d}" data-device-scope="${scope}" class="${device===d?'active':''}" aria-pressed="${device===d}" aria-label="${{desktop:'桌面',tablet:'平板',mobile:'手机'}[d]}预览">${icon(d)}</button>`).join('')}</div>`;}
function themeControls(theme,prefix){return `<div class="field"><span>主题预设</span><select data-theme="id" data-theme-scope="${prefix}" aria-label="主题预设">${THEMES.map(t=>`<option value="${t.id}" ${theme.id===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div><div class="preset-colors">${['#3d6655','#7356b7','#2563eb','#a94729','#e6f06d','#b3f572'].map(c=>`<button style="--swatch:${c}" data-color-preset="${c}" data-theme-scope="${prefix}" aria-label="应用强调色 ${c}"></button>`).join('')}</div>${[['accent','强调色'],['bg','页面底色']].map(([k,n])=>`<div class="field"><span>${n}</span><div class="color-field"><input type="color" data-theme="${k}" data-theme-scope="${prefix}" value="${esc(theme[k])}" aria-label="${n}"><input type="text" data-theme="${k}" data-theme-scope="${prefix}" value="${esc(theme[k])}" pattern="#[0-9a-fA-F]{6}" aria-label="${n}十六进制值" maxlength="7"></div></div>`).join('')}<div class="field"><span>字体方向</span><select data-theme="font" data-theme-scope="${prefix}" aria-label="字体方向">${[['sans','现代无衬线'],['serif','编辑式衬线'],['mono','等宽与技术感']].map(([v,n])=>`<option value="${v}" ${theme.font===v?'selected':''}>${n}</option>`).join('')}</select></div>${[['radius','圆角',0,40,'px'],['space','章节间距',24,120,'px']].map(([k,n,min,max,u])=>`<div class="field"><label class="range-label">${n}<output data-output="${prefix}-${k}">${theme[k]}${u}</output></label><input type="range" min="${min}" max="${max}" value="${theme[k]}" data-theme="${k}" data-theme-scope="${prefix}" aria-label="${n}"></div>`).join('')}`;}
function propsControls(block,scope){return Object.entries(block.props).map(([k,v])=>`<label class="field"><span>${{eyebrow:'上方短句 / Eyebrow',title:'主要标题',subtitle:'说明文字',button:['stats','timeline','tabs','gallery','command'].includes(block.type)?'内容列表（英文逗号分隔）':'按钮文字',secondary:'次要文字或价格',items:'内容列表（每行一条，字段用 | 分隔）'}[k]||k}</span>${['title','subtitle','items'].includes(k)?`<textarea rows="${k==='items'?6:k==='title'?2:3}" maxlength="4000" data-prop="${esc(k)}" data-prop-scope="${scope}">${esc(v)}</textarea>`:`<input type="text" maxlength="4000" data-prop="${esc(k)}" data-prop-scope="${scope}" value="${esc(v)}">`}</label>`).join('');}
function openDetail(item){if(item.kind==='site'){caseUI.open(item.id);return}if(item.kind==='reference'||item.kind==='opensource'||item.kind==='resource'||item.kind==='skill'){openResource(item);return}detailState={item,project:item.kind==='template'?createProject(item.id):{version:1,name:item.name,theme:{...project.theme},blocks:[createBlock(item.id)],customCSS:''},device:'desktop'};renderDetail();openDialog(details);}
function renderDetail(){const {item,project:p,device}=detailState;$('#detail-content').innerHTML=`<div class="dialog-top"><div><span class="eyebrow">YOUR PLAYGROUND / ORIGINAL DEMO</span><h2>${esc(item.name)}</h2><p>${esc(item.description)}</p></div><div class="dialog-actions"><button class="secondary-button" data-action="detail-code">${icon('code')} 查看源码</button><button class="icon-btn" data-close="detail" aria-label="关闭预览">${icon('close')}</button></div></div><div class="detail-layout"><div class="detail-preview-pane"><div class="preview-toolbar"><span><i></i> LIVE PREVIEW</span>${deviceControls('detail',device)}</div><div class="iframe-viewport" data-device="${device}" id="detail-viewport"><iframe id="detail-iframe" title="${esc(item.name)}实时预览" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></div><p class="detail-demo-hint">试着点击预览里的按钮，或调整右侧参数。表单与商业操作均为本地演示。</p></div><aside class="detail-controls"><div class="control-group"><h3>让设计，带上你的风格。</h3>${themeControls(p.theme,'detail')}</div>${p.blocks.length===1?`<div class="control-group"><h3>改改文案</h3>${propsControls(p.blocks[0],'detail')}</div>`:'<div class="control-group"><h3>这是一张完整页面</h3><p class="source-note">把模板加入拼装台，即可逐块编辑、排序、替换与组合。</p></div>'}<p class="source-note">本站原创演示 · MIT License<br>原生 HTML + CSS + JavaScript，无需第三方运行时。</p></aside></div><div class="detail-bottom"><span>修改仅影响这份预览。把它加入拼装台，继续创作。</span><button class="primary-button" data-action="detail-add">${icon('plus')}${item.kind==='template'?'使用这个模板':'加入我的页面'}</button></div>`;$('#detail-iframe').srcdoc=generateDocument(p);}
function openResource(item){const isRef=item.kind==='reference',isSkill=item.kind==='skill';const title=isRef?'LOCAL DESIGN REFERENCE':isSkill?'LOCAL SKILL / CAPABILITY INDEX':'VERIFIED RESOURCE / OFFICIAL SOURCE';const notes=Array.isArray(item.notes)?item.notes.join('\n'):item.notes||'';const palette=(item.colors||[]).filter(c=>/^#[0-9a-f]{6}$/i.test(c));const special=item.projectType==='source-available';$('#info-content').innerHTML=`<div class="dialog-top"><div><span class="eyebrow">${title}</span><h2>${esc(item.name)}</h2></div><button class="icon-btn" data-close="info" aria-label="关闭资源详情">${icon('close')}</button></div><div class="info-body"><div class="resource-detail-title">${esc(item.name)} <span aria-hidden="true">↗</span></div><p>${esc(item.descriptionZh||item.description)}</p><div class="info-pills">${(item.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}${special?'<span>源码可见 · 非宽松开源</span>':''}</div><dl class="resource-meta-table"><dt>资源类别</dt><dd>${esc(item.category||roleName(item.role))}</dd><dt>${isSkill?'本地位置':'代码 / 文档许可'}</dt><dd>${esc(isSkill?item.localPath:licenseOf(item))}</dd><dt>来源</dt><dd>${https(item.source)?safeLink(item.source,'查看来源 ↗'):'本地文件索引'}</dd>${!isRef&&!isSkill?`<dt>核对日期</dt><dd>${esc(item.verifiedAt||catalog.generatedAt)}</dd>`:''}</dl>${isRef?`<h3>原创模块 × 参考主题</h3><div class="reference-live-preview"><iframe id="reference-preview-iframe" title="参考主题的原创演示预览" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></div><p class="source-note">依据文档中的语义色值套用本站原创模块；版式为原创演示，使用系统字体代替专有字体。</p><h3>从原文提取的颜色</h3><div class="reference-palette">${palette.map(c=>`<button data-copy-color="${esc(c)}" style="--s:${c}" aria-label="复制颜色 ${c}"><i></i>${esc(c)}</button>`).join('')}</div><button class="secondary-button reference-token-button" data-apply-reference="${esc(item.id)}">${icon('palette')}用这组配色，试试原创模块</button><h3>使用范围</h3><p>${esc(item.license?.document?.note||'参考文档授权以来源为准。')}</p><p>${esc(item.license?.brandAssets?.note||'品牌资产需独立授权。')}</p>`:isSkill?`<h3>它擅长什么</h3><ul>${(item.capabilities||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul><h3>可复制的任务提示</h3><pre>${esc(item.prompt)}</pre><button class="secondary-button" data-copy-prompt="${esc(item.id)}">${icon('copy')}复制提示词</button><p class="source-note">此网页整理技能索引。运行技能需要回到支持该技能的环境，并按其真实指引执行。</p>`:`<div class="dialog-actions">${safeLink(item.docs,`${icon('external')}官方文档 / 预览`,'primary-button')}${safeLink(item.source,`${icon('code')}仓库源码`,'secondary-button')}</div><h3>源码怎么使用</h3><p>在官方文档选定组件，按其安装或复制说明放入对应框架的项目。完整源码与授权以仓库为准。</p><p>${special?'此资源有额外再分发限制。本工作台仅提供索引入口，不收录、改写或导出该项目的组件。':'本工作台没有打包此库的实现；「可玩模块」中的预览和导出均为本站原创。'}</p>${https(item.licenseUrl)?`<p>${safeLink(item.licenseUrl,'阅读许可证原文 ↗')}</p>`:''}`}<h3>索引说明</h3><div class="reference-content">${esc(notes||'根据本地技能元数据或官方仓库整理。')}</div></div>`;openDialog(infoDialog);if(isRef){const demo={version:1,name:item.name+' · 配色实验',theme:referenceTheme(item),blocks:[createBlock('hero-editorial'),createBlock('features')],customCSS:''};$('#reference-preview-iframe').srcdoc=generateDocument(demo);}}
function applyReference(id){const r=references.find(x=>x.id===id);if(!r)return;closeDialog(infoDialog);mutate(()=>project.theme=referenceTheme(r));setView('builder');toast('已应用 '+r.name+' 文档中提取的主题颜色，可继续自行调整。');}
function selectedBlock(){return project.blocks.find(b=>b.uid===selected);}

m ${selected===x.uid?'active':''} ${x.hidden?'hidden-layer':''}" draggable="true" data-layer="${esc(x.uid)}" role="button" tabindex="0" aria-label="选择第 ${i+1} 层 ${esc(BLOCKS.find(d=>d.id===x.type)?.name)}"><span class="drag-grip">⠿</span>${icon('layers')}<span class="layer-name">${esc(BLOCKS.find(d=>d.id===x.type)?.name)}</span><span class="layer-index">${String(i+1).padStart(2,'0')}</span></div>`).join('')||'<div class="inspector-empty">画布还很安静。<br>加一个模块，开始吧。</div>'}</div><div class="layer-tools">${[['up','上移图层','layer-up'],['down','下移图层','layer-down'],['copy','复制图层','layer-duplicate'],['eye',b?.hidden?'显示图层':'隐藏图层','layer-hide'],['trash','移除图层','layer-remove']].map(([i,n,a])=>`<button class="icon-btn" data-action="${a}" aria-label="${n}" title="${n}" ${b?'':'disabled'}>${icon(i)}</button>`).join('')}</div><button class="add-block-btn" data-builder-tab="assets">${icon('plus')}添加一个新模块</button>`:`<label class="asset-search">${icon('search')}<input id="asset-search" type="search" placeholder="搜索模块…" aria-label="搜索可添加模块" value="${esc(view.assetSearch)}"></label><span class="search-result-count">点击加入当前图层下方</span><div class="builder-asset-list" id="asset-list">${renderAssets()}</div>`}<p class="builder-help">拖动图层可以排序，也可选中后使用上移 / 下移按钮。隐藏图层不会出现在导出页面中。项目会自动保存在当前浏览器。</p></aside><div class="builder-stage"><div class="builder-stage-top"><span><i></i> YOUR LIVE CANVAS</span><span>${project.blocks.filter(x=>!x.hidden).length} 个可见模块 · 原生 HTML</span></div><div class="builder-preview" id="builder-viewport" data-device="${view.device}"><iframe id="builder-iframe" title="我的页面实时预览" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></div><div class="stage-bottom"><span>点击预览中的模块，定位到对应图层。</span><span id="device-label">${{desktop:'自动适配',tablet:'768 px',mobile:'375 px'}[view.device]}</span></div></div><aside class="builder-panel right"><div class="inspector-title">设计检查器 / INSPECTOR</div><div class="inspector-section"><h3>全局主题 <span>↗</span></h3>${themeControls(project.theme,'bui function renderAssets(){const q=view.assetSearch.trim().toLowerCase();const items=BLOCKS.filter(b=>[b.name,b.id,b.category,...b.tags].join(' ').toLowerCase().includes(q));return items.length?items.map(b=>`<button class="asset-item" data-add="${b.id}"><span>${{首屏:'✳',内容:'◈',商业:'↗',导航:'≡',数据:'▥',表单:'⌘',组件:'◇',动效:'◎'}[b.category]||'✳'}</span><div><b>${esc(b.name)}</b><small>${esc(b.category)}</small></div><i>+</i></button>`).join(''):'<div class="inspector-empty">没有匹配的模块。</div>';}
function setupDrag(){const list=$('#layer-list');if(!list)return;list.addEventListener('dragstart',e=>{const item=e.target.closest('[data-layer]');if(!item)return;draggedLayer=item.dataset.layer;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedLayer)});list.addEventListener('dragover',e=>{const item=e.target.closest('[data-layer]');if(!item)return;e.preventDefault();$$('.drag-over',list).forEach(x=>x.classList.remove('drag-over'));item.classList.add('drag-over')});list.addEventListener('dragleave',e=>e.target.closest('[data-layer]')?.classList.remove('drag-over'));list.addEventListener('drop',e=>{e.preventDefault();const target=e.target.closest('[data-layer]');const from=project.blocks.findIndex(b=>b.uid===draggedLayer),to=project.blocks.findIndex(b=>b.uid===target?.dataset.layer);if(from<0||to<0||from===to)return;mutate(()=>{const[b]=project.blocks.splice(from,1);project.blocks.splice(to,0,b);selected=b.uid});draggedLayer=''});list.addEventListener('dragend',()=>{$$('.drag-over',list).forEach(x=>x.classList.remove('drag-over'));draggedLayer=''})}

function about(){const date=catalog.generatedAt||'2026-10-22';$('#info-content').innerHTML=`<div class="dialog-top"><div><span class="eyebrow">A SPACE FOR YOUR NEXT IDEA</span><h2>关于 Design Atlas</h2></div><button class="icon-btn" data-close="info" aria-label="关闭说明">${icon('close')}</button></div><div class="info-body"><h3>从一个想法，到一份可运行的界面</h3><p>这是一个前端设计探索与拼装工作台：${caseUI.items().length} 个公开网站案例、${caseUI.recipes().length} 份设计配方、${BLOCKS.length} 个原创模块、${TEMPLATES.length} 套整页模板、${THEMES.length} 种主题、${references.length} 份本地设计参考、${catalog.resources.length} 个源码资源和 ${catalog.skills.length} 项本地技能索引。</p><h3>三个容易混淆的地方</h3><ul><li>可玩模块是本工作台独立编写的 HTML / CSS / JavaScript 演示，可编辑、组合、复制和导出，采用 MIT 许可证。</li><li>设计参考来自本地 DESIGN.md；提取名称、摘要与颜色，不复制品牌页面、图片、字体或资产。文档许可与品牌资产许可分列展示。</li><li>开源资源索引提供官方文档、演示与仓库入口，库本身未打包进本工作台。React Bits 等特殊许可资源有独立标识，不再分发其组件。</li></ul><h3>目录的范围</h3><p>本地索引扫描技能安装目录及 DESIGN.md 文件，实际收录范围见随附 README。互联网资源数量持续变化，本次为截至 ${esc(date)} 核对的精选目录，不代表穷尽所有前端设计项目。可修改 data/catalog.json 扩充，再运行离线打包脚本。</p><h3>保存与可离线使用</h3><p>项目和收藏保存在当前浏览器的 localStorage；切换域名、浏览器或清理存储后不会自动同步。使用「保存项目」导出 JSON，可在别处重新导入。导出的完整 HTML、随附 offline.html 都不依赖外部 CDN。本站不收集或上传表单数据。</p><h3>键盘与辅助操作</h3><ul><li><kbd>/</kbd>：资源库聚焦搜索。</li><li><kbd>Ctrl / ⌘ + Z</kbd>：拼装台撤销；加 Shift 重做。输入框保留浏览器自身的撤销行为。</li><li><kbd>Ctrl / ⌘ + S</kbd>：在拼装台下载项目 JSON。</li><li><kbd>Esc</kbd>：关闭当前弹窗。标签切换、图层选择与按钮均可用键盘操作。</li></ul><h3>扩充目录</h3><p>在项目目录执行 <code>node scripts/refresh-local-catalog.mjs</code> 重新扫描本地技能，再执行 <code>node scripts/build-offline.mjs</code> 更新离线文件。开源目录使用已核对的固定快照，不会在网页打开时自动联网抓取。新增网站案例、学习笔记与配方可在「公开网站案例 → 扩充我的库」管理和导入导出。网站卡片与预览是本站原创适配，原站观察范围在详情中注明。</p><p>${safeLink('https://github.com/VoltAgent/awesome-design-md','本地参考库的上游 ↗')} · ${safeLink('https://ui.shadcn.com/docs/directory','探索更多官方登记的社区 registry ↗')}</p></div>`;openDialog(infoDialog);}

 if(el.dataset.device){const scope=el.dataset.deviceScope;const d=el.dataset.device;if(scope==='builder'){view.device=d;$('#builder-viewport').dataset.device=d;$('#device-label').textContent={desktop:'自动适配',tablet:'768 px',mobile:'375 px'}[d]}else{detailState.device=d;$('#detail-viewport').dataset.device=d}$$(`[data-device-scope="${scope}"]`).forEach(b=>{b.classList.toggle('active',b===el);b.setAttribute('aria-pressed',b===el)});return}
 if(el.dataset.colorPreset){const scope=el.dataset.themeScope;if(scope==='builder')mutate(()=>project.theme.accent=el.dataset.colorPreset);else{detailState.project.theme.accent=el.dataset.colorPreset;renderDetail()}return}
 if(el.dataset.copyColor){copy(el.dataset.copyColor,'色值已复制：'+el.dataset.copyColor);return}if(el.dataset.applyReference){applyReference(el.dataset.applyReference);return}if(el.dataset.copyPrompt){const s=catalog.skills.find(x=>x.id===el.dataset.copyPrompt);if(s)copy(s.prompt,'任务提示已复制，可在支持此技能的环境中使用。');return}
 if(el.dataset.useTemplate){useTemplate(el.dataset.useTemplate);return}if(el.dataset.applyTheme){const t=THEMES.find(x=>x.id===el.dataset.applyTheme);mutate(()=>project.theme={...t});setView('builder');toast('主题已应用。');return}if(el.dataset.copyTheme){copy(themeCSS(THEMES.find(x=>x.id===el.dataset.copyTheme)),'主题 CSS 变量已复制。');return}
 if(el.dataset.codeTab){codeState.tab=el.dataset.codeTab;renderCode();return}
 const action=el.dataset.action;if(!action)return;
 if(action==='undo')undo();else if(action==='redo')redo();else if(action.startsWith('layer-'))layerAction(action.slice(6));else if(action==='project-code')openCode(project);else if(action==='detail-code')openCode(detailState.project);else if(action==='detail-add')addDetail();else if(action==='import-project')$('#project-file').click();else if(action==='export-project')download(JSON.stringify(project,null,2),filename(project.name)+'.atlas.json','application/json');else if(action==='blank-project'){mutate(()=>{project={version:1,name:'我的新作品',theme:{...project.theme},blocks:[],customCSS:''};selected='';view.builderTab='assets'});toast('空白画布已准备好。上一个页面可以撤销恢复。')}else if(action==='apply-css'){mutate(()=>project.customCSS=$('#custom-css').value.slice(0,50000),{render:false});toast('自定义 CSS 已应用并保存。')}else if(action==='copy-code')copy(codeState.files[codeState.tab]);else if(action==='download-code'){const extensions={full:'html',html:'html',css:'css',js:'js',json:'json'};download(codeState.files[codeState.tab],filename(codeState.project.name)+(codeState.tab==='html'?'.fragment':'')+'.'+extensions[codeState.tab],codeState.tab==='json'?'application/json':'text/plain;charset=utf-8')}else if(action==='run-code')runCode();else if(action==='return-code'){closeDialog(infoDialog);renderCode();openDialog(codeDialog)}else if(action==='clear-filters'){if(view.name==='favorites')setView('library','blocks');else{view.filter='全部';view.q='';view.page=1;renderLibrary()}}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.theme){if(el.tagName!=='SELECT')changeTheme(el);return}if(el.dataset.prop){const scope=el.dataset.propScope,key=el.dataset.prop;if(scope==='detail'){detailState.project.blocks[0].props[key]=el.value;$('#detail-iframe').srcdoc=generateDocument(detailState.project)}else{const b=selectedBlock();if(b)mutate(()=>b.props[key]=el.value,{render:false})}}});
document.addEventListener('change',e=>{if(e.target.matches('select[data-theme]'))changeTheme(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sidebar').classList.contains('open'))closeSidebar();const el=e.target,isInput=/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)||el.isContentEditable;if(e.key==='/'&&!isInput&&!$$('dialog[open]').length){const search=$('#library-search')||$('#case-search');if(search){e.preventDefault();search.focus()}}if((e.ctrlKey||e.metaKey)&&!isInput&&view.name==='builder'&&!$$('dialog[open]').length){if(e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}if(e.key.toLowerCase()==='s'){e.preventDefault();download(JSON.stringify(project,null,2),filename(project.name)+'.atlas.json','application/json')}}if(['Enter',' '].includes(e.key)&&el.matches('[data-open],[data-layer]')&&el.tagName!=='BUTTON'){e.preventDefault();el.click()}if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)&&el.getAttribute('role')==='tab'){const tabs=$$('[role="tab"]',el.parentElement);if(!tabs.length)return;e.preventDefault();const i=tabs.indexOf(el);const n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[n].click();const selector=tabs[n].dataset.librarySection?`[data-library-section="${tabs[n].dataset.librarySection}"]`:tabs[n].dataset.builderTab?`[data-builder-tab="${tabs[n].dataset.builderTab}"]`:`[data-code-tab="${tabs[n].dataset.codeTab}"]`;$(selector)?.focus()}});
window.addEventListener('message',e=>{const frame=$('#builder-iframe');if(e.source!==frame?.contentWindow||e.data?.type!=='atlas-select'||typeof e.data.uid!=='string')return;if(project.blocks.some(b=>b.uid===e.data.uid))selectLayer(e.data.uid)});
$('#project-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>16*1024*1024)throw Error('项目文件过大，最多支持 16 MB。');const p=validateProject(JSON.parse(await file.text()));mutate(()=>{project=p;selected=p.blocks[0]?.uid||''});setView('builder');toast('项目已导入。之前的页面可通过撤销恢复。')}catch(err){toast('导入失败：'+err.message,true)}});
$('#mobile-menu').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#sidebar-backdrop').hidden=false;$('#mobile-menu').setAttribute('aria-expanded','true');syncSidebar();document.body.style.overflow='hidden';$('#close-sidebar').focus()});$('#close-sidebar').addEventListener('click',closeSidebar);matchMedia('(max-width:760px)').addEventListener('change',syncSidebar);$('.logo').addEventListener('click',e=>{e.preventDefault();setView('library','blocks')});$('#sidebar-backdrop').addEventListener('click',closeSidebar);$('#about-button').addEventListener('click',about);$('#keyboard-help').addEventListener('click',about);
window.addEventListener('pagehide',()=>{if(saveTimer){try{localStorage.setItem(STORAGE,JSON.stringify(project))}catch{}}});

async function boot(){try{if(window.__ATLAS_DATA__){catalog=window.__ATLAS_DATA__.catalog;references=window.__ATLAS_DATA__.references}else{const responses=await Promise.all([fetch('./data/catalog.json'),fetch('./data/local-references.json')]);if(responses.some(r=>!r.ok))throw Error('资源目录加载失败。');[catalog,references]=await Promise.all(responses.map(r=>r.json()))}if(!Array.isArray(catalog.skills)||!Array.isArray(catalog.resources)||!Array.isArray(references))throw Error('目录数据格式不正确。');const hash=location.hash.slice(1);if(['cases','library','builder','themes','favorites'].includes(hash))view.name=hash;try{let cases;if(window.__ATLAS_DATA__)cases=window.__ATLAS_DATA__.cases;else{const res=await fetch('./data/site-cases.json');if(!res.ok)throw Error('案例数据尚未加载，可继续使用拼装台。');cases=await res.json()}caseUI.load(cases)}catch(error){caseUI.setError('网站案例库加载失败：'+error.message+' 其他功能仍可使用。')}render();syncSidebar();if(bootWarning)toast('已使用新草稿，详情见页面上方说明。',true)}catch(err){main.innerHTML=`<div class="read-error"><h1>工作台还差一步，就能打开。</h1><p>如果你直接双击了 index.html，请改为打开随附的 <b>offline.html</b>；或运行项目里的「启动工作台.cmd」。</p><pre>node scripts/serve.mjs\n\n打开 http://127.0.0.1:4317</pre><p>${esc(err.message)}</p></div>`;toast('资源加载失败，请查看页面说明。',true)}hydrateIcons();}
function makeRecipeProject(recipe){const blank={version:1,name:'新页面',theme:{...THEMES[0]},blocks:[],customCSS:''};const plan=recipePlan(blank,recipe,'replace',{blocks:BLOCKS,themes:THEMES});return materializePlan(plan);}
function materializePlan(plan){return {version:1,name:plan.name,theme:plan.theme,customCSS:plan.customCSS,blocks:[...plan.existingBlocks,...plan.newBlocks.map(b=>{const created=createBlock(b.type);created.props={...created.props,...b.props};return created})]};}
const caseUI=createCaseUI({root:main,toast,download,openCode,getProject:()=>JSON.parse(JSON.stringify(project)),makeProject:makeRecipeProject,navigate:()=>setView('cases'),changed(){navigation();if(view.name==='favorites')renderLibrary()},apply(recipe,mode){try{const plan=recipePlan(project,recipe,mode,{blocks:BLOCKS,themes:THEMES}),next=materializePlan(plan);mutate(()=>{project=next;ensureSelection()});setView('builder');toast(mode==='theme'?'建议主题已应用，原有图层保留。':mode==='append'?'配方模块已追加，保留当前主题。可一步撤销。':'页面已生成。原有页面可一步撤销恢复。');return true}catch(error){toast('无法应用：'+error.message,true);return false}}});
boot();

return {};
})();
